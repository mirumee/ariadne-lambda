[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ariadne-lambda"
dynamic = ["version"]
description = "This package extends the Ariadne library by adding a GraphQL HTTP handler designed for use in AWS Lambda environments."
authors = [{ name = "Mirumee Software", email = "ariadne@mirumee.com" }]
requires-python = ">= 3.10"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "ariadne>=1.0.1,<2.0.0",
  "aws-lambda-powertools>=3.0.0,<4.0.0",
  "pydantic>=2.4.0,<3.0.0",
]

[project.optional-dependencies]
# `pip` is required in `.venv` when using Hatch with `path = ".venv"` (Hatch syncs via pip).
dev = ["ipdb", "pip>=24.0"]
test = [
  "pytest>=9.0.0,<10.0.0",
  "pytest-asyncio>=1.0.0,<2.0.0",
  "pytest-cov[toml]>=7.0.0,<8.0.0",
]
types = ["ty>=0.0.20,<0.1.0"]

[project.urls]
"Homepage" = "https://ariadnegraphql.org/"
"Repository" = "https://github.com/mirumee/ariadne-lambda"
"Bug Tracker" = "https://github.com/mirumee/ariadne-lambda/issues"
"Community" = "https://github.com/mirumee/ariadne/discussions"

[tool.hatch.build]
include = ["ariadne_lambda/**/*.py"]
exclude = ["tests"]

[tool.hatch.version]
path = "ariadne_lambda/__about__.py"

[tool.hatch.envs.default]
python = "3.10"
features = ["dev", "types", "test"]
path = ".venv"

[tool.hatch.envs.default.scripts]
lint = ["hatch fmt --check", "hatch run types:check"]
check = [
  "hatch fmt",
  "hatch test -a -p",
  "hatch test --cover",
  "hatch run types:check",
]
changelog-preview = "git cliff --unreleased --strip all"
changelog-update = "git cliff --unreleased -o CHANGELOG.md"
release-notes = "git cliff --latest --strip all"

[tool.hatch.envs.types.scripts]
check = ["ty check"]

[tool.hatch.envs.hatch-static-analysis]
config-path = "none"
dependencies = ["ruff==0.15.0"]

[tool.hatch.envs.hatch-test]
features = ["test"]
extra-args = []

[[tool.hatch.envs.hatch-test.matrix]]
python = ["3.10", "3.11", "3.12", "3.13", "3.14"]

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
include = ["ariadne_lambda", "tests"]

[tool.ty.rules]
unused-type-ignore-comment = "ignore"
redundant-cast = "ignore"

[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
missing-argument = "ignore"
no-matching-overload = "ignore"
unresolved-attribute = "ignore"
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
unknown-argument = "ignore"
not-iterable = "ignore"
possibly-missing-attribute = "ignore"

[[tool.ty.overrides]]
include = [
  "tests/main/clients/*/expected_client/**",
  "tests/main/graphql_schemas/*/expected_schema.py",
]

[tool.ty.overrides.analysis]
allowed-unresolved-imports = ["**"]

[tool.coverage.run]
source = ["ariadne_lambda", "tests"]

[tool.coverage.report]
exclude_also = [
  "def __repr__",
  "if self.debug:",
  "if settings.DEBUG",
  "raise AssertionError",
  "raise NotImplementedError",
  "if 0:",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "class .*\\bProtocol\\):",
  "@(abc\\.)?abstractmethod",
]
omit = ["*/__about__.py", "*/__main__.py", "*/cli/__init__.py"]
# TODO: Enable this when we have more tests
# fail_under = 90

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 99
exclude = ["tests/main/clients/*/expected_client/*"]

[tool.ruff.lint]
select = ["E", "F", "G", "I", "N", "Q", "UP", "B", "C90", "SIM", "T20", "TID"]
ignore = ["TID252", "UP006", "UP007", "UP045"]
task-tags = ["NOTE", "TODO", "FIXME", "HACK", "XXX"]

[tool.ruff.lint.per-file-ignores]
"tests/main/graphql_schemas/*/expected_schema.py" = ["E501"]
"tests/main/clients/*/expected_client/*" = ["E501", "N801", "F401"]

[tool.ruff.lint.pycodestyle]
ignore-overlong-task-comments = true

[tool.ruff.lint.mccabe]
max-complexity = 11

[tool.ruff.lint.isort]
known-first-party = ["ariadne_lambda"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pytest.ini_options]
testpaths = ["tests"]
