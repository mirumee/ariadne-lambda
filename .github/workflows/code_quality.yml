name: Code Quality

on:
  push:
    branches:
      - "*"
    tags:
      - "*"

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install hatch

      - name: Build the package
        run: |
          hatch build

      - name: Run linter
        run: |
          hatch run ruff check .
